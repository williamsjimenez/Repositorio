<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Sistema de indicadores de bienestar policial — Policía Nacional del Ecuador, Fase 2.">
  <title>Sistema de Indicadores · Bienestar Policial · Ecuador</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <div class="kicker">Policía Nacional del Ecuador · Fase 2</div>
        <h1>Sistema de Indicadores de Bienestar Policial</h1>
      </div>
      <div class="cutoff">Corte 24.09.2026</div>
    </div>
  </header>

  <main>
    <nav id="dimNav" class="dimension-nav" aria-label="Dimensiones"></nav>

    <section class="toolbar">
      <div class="view-switch" role="group" aria-label="Vista">
        <button class="view-btn active" data-view="data">Datos</button>
        <button class="view-btn" data-view="gaps">Vacíos</button>
        <button class="view-btn" data-view="all">Todos</button>
      </div>
      <input id="search" type="search" placeholder="Buscar indicador o fuente">
      <button id="exportBtn" class="ghost">CSV</button>
    </section>

    <div class="counter"><strong id="resultCount">—</strong></div>
    <div id="cards"></div>
  </main>

  <footer>
    Cada tarjeta conserva periodo y fuente. Los vacíos se muestran en una vista separada para no competir visualmente con los datos.
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
